<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Install Blocks</title>
  <meta name="color-scheme" content="light dark" />
  <style>
    :root { --bg: #ffffff; --text: #1f1f1d; --muted: #73726e; --faint: #a5a49f; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #191919; --text: #e6e5e2; --muted: #9b9a96; --faint: #6f6e6a; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
    main { max-width: 320px; text-align: center; }
    h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
    p { margin: 0 0 12px; color: var(--muted); }
    .install { display: block; margin: 24px auto 20px; padding: 16px 24px; border-radius: 10px; background: var(--text); color: var(--bg); font-size: 18px; font-weight: 600; text-decoration: none; }
    .install:active { opacity: 0.88; }
    .meta { font-size: 13px; color: var(--faint); }
  </style>
</head>
<body>
  <main>
    <h1>Blocks</h1>
    <p class="meta">Version 1.0.7, built 9 October 2026, 04:55 UTC</p>
    <a class="install" href="itms-services://?action=download-manifest&amp;url=https://caulfieldengineering.github.io/blocks-install/manifest.plist">Install</a>
    <p>Open this page in Safari on the iPhone.</p>
    <p>Tailscale must be on.</p>
  </main>
</body>
</html>
